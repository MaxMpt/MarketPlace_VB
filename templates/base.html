{% load static %}
<!DOCTYPE html>
<html lang="ru" class="antialiased{% if theme == 'dark' %} dark{% endif %}" data-uid="{{ resident.id }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="{% if theme == 'dark' %}#1c1c1e{% else %}#ffffff{% endif %}">
  <title>{{ title|default:"ВБ2 Каталог" }}</title>
  <link rel="stylesheet" href="{% static 'catalog/app.css' %}?v=12">
  {% block extra_head %}{% endblock %}
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    {% if back or tab != 'home' %}
    <header class="app-header">
      {% if back %}
        <a class="icon-btn" href="{{ back }}" aria-label="Назад">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
      {% else %}
        <span class="icon-btn"></span>
      {% endif %}
      <h1>{{ title }}</h1>
      <span class="icon-btn"></span>
    </header>
    {% endif %}
    <main class="app-main">
      {% block content %}{% endblock %}
    </main>
    <nav class="app-nav">
      <a href="{% url 'home' %}" class="{% if tab == 'home' %}active{% endif %}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
        Главная
      </a>
      <a href="{% url 'services' %}" class="{% if tab == 'services' %}active{% endif %}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Услуги
      </a>
      <a href="{% url 'companies' %}" class="{% if tab == 'companies' %}active{% endif %}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/></svg>
        Компании
      </a>
      <a href="{% url 'profile' %}" class="{% if tab == 'profile' %}active{% endif %}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 6-6 8-6s6.5 2 8 6"/></svg>
        Профиль
      </a>
    </nav>
  </div>
  <script src="{% static 'catalog/app.js' %}?v=11"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
