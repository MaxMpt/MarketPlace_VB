<form class="search" method="get">
  {% if cat %}<input type="hidden" name="cat" value="{{ cat }}">{% endif %}
  <label>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" name="q" value="{{ q }}" placeholder="Найти по названию" maxlength="80" enterkeyhint="search">
  </label>
</form>
